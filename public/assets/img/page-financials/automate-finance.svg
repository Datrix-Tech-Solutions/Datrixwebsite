<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <linearGradient id="gCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDB249"/>
      <stop offset="1" stop-color="#E8720C"/>
    </linearGradient>
    <filter id="shA" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0A3D66" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- soft halo -->
  <circle cx="250" cy="250" r="238" fill="#D9EDFB" opacity="0.55"/>

  <!-- orbit ring -->
  <circle cx="250" cy="250" r="170" fill="none" stroke="#2D9CDB" stroke-width="2.5" stroke-dasharray="3 10" stroke-linecap="round"/>
  <circle cx="250" cy="250" r="120" fill="none" stroke="#B9DFF6" stroke-width="1.75"/>

  <!-- connector spokes -->
  <g stroke="#C9E6F8" stroke-width="2.5">
    <path d="M 250 250 L 250 80"/>
    <path d="M 250 250 L 370 130"/>
    <path d="M 250 250 L 420 250"/>
    <path d="M 250 250 L 370 370"/>
    <path d="M 250 250 L 250 420"/>
    <path d="M 250 250 L 130 370"/>
    <path d="M 250 250 L 80 250"/>
    <path d="M 250 250 L 130 130"/>
  </g>

  <!-- centre core -->
  <circle cx="250" cy="250" r="64" fill="url(#gCore)" filter="url(#shA)"/>
  <circle cx="250" cy="250" r="72" fill="none" stroke="#FDB249" stroke-width="2" opacity="0.5"/>
  <text x="250" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" letter-spacing="1">ONE</text>
  <text x="250" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" letter-spacing="1">APPLICATION</text>

  <!-- ======== nodes ======== -->

  <!-- top: Inventory (building) -->
  <g filter="url(#shA)">
    <circle cx="250" cy="80" r="33" fill="#FFFFFF"/>
  </g>
  <path d="M 236 90 L 236 74 L 250 64 L 264 74 L 264 90 Z" fill="#21346B"/>
  <g fill="#FFFFFF">
    <rect x="241" y="77" width="5" height="5"/>
    <rect x="248" y="77" width="5" height="5"/>
    <rect x="255" y="77" width="5" height="5"/>
    <rect x="241" y="84" width="5" height="5"/>
    <rect x="255" y="84" width="5" height="5"/>
  </g>
  <text x="250" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#21346B">Inventory</text>

  <!-- top-right: Intelligence (lightbulb) -->
  <g filter="url(#shA)">
    <circle cx="370" cy="130" r="33" fill="#FFFFFF"/>
  </g>
  <circle cx="370" cy="126" r="11" fill="#1B75BB"/>
  <rect x="365" y="137" width="10" height="5" rx="2.5" fill="#F7941D"/>
  <rect x="366" y="144" width="8" height="4" rx="2" fill="#F7941D" opacity="0.7"/>
  <g stroke="#F7941D" stroke-width="2.5" stroke-linecap="round">
    <path d="M 370 108 L 370 103"/>
    <path d="M 385 114 L 389 110"/>
    <path d="M 355 114 L 351 110"/>
  </g>
  <text x="370" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#21346B">Intelligence</text>

  <!-- right: Sales (bar chart) -->
  <g filter="url(#shA)">
    <circle cx="420" cy="250" r="33" fill="#FFFFFF"/>
  </g>
  <g>
    <rect x="404" y="252" width="7" height="14" rx="2.5" fill="#2D9CDB"/>
    <rect x="415" y="244" width="7" height="22" rx="2.5" fill="#1B75BB"/>
    <rect x="426" y="236" width="7" height="30" rx="2.5" fill="#F7941D"/>
  </g>
  <text x="420" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#21346B">Sales</text>

  <!-- bottom-right: Purchase (cart) -->
  <g filter="url(#shA)">
    <circle cx="370" cy="370" r="33" fill="#FFFFFF"/>
  </g>
  <path d="M 354 358 L 360 358 L 365 376 L 384 376 L 388 363 L 362 363" stroke="#21346B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="368" cy="383" r="3.5" fill="#F7941D"/>
  <circle cx="382" cy="383" r="3.5" fill="#F7941D"/>
  <text x="370" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#21346B">Purchase</text>

  <!-- bottom: Accounting (calculator) -->
  <g filter="url(#shA)">
    <circle cx="250" cy="420" r="33" fill="#FFFFFF"/>
  </g>
  <rect x="237" y="404" width="26" height="34" rx="5" fill="#21346B"/>
  <rect x="241" y="409" width="18" height="8" rx="2" fill="#2D9CDB"/>
  <g fill="#F7941D">
    <rect x="241" y="421" width="4.5" height="4.5" rx="1"/>
    <rect x="248" y="421" width="4.5" height="4.5" rx="1"/>
    <rect x="255" y="421" width="4.5" height="4.5" rx="1"/>
    <rect x="241" y="429" width="4.5" height="4.5" rx="1"/>
    <rect x="248" y="429" width="4.5" height="4.5" rx="1"/>
  </g>
  <rect x="255" y="429" width="4.5" height="4.5" rx="1" fill="#2E9E6B"/>
  <text x="250" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#21346B">Accounting</text>

  <!-- bottom-left: Orders (document) -->
  <g filter="url(#shA)">
    <circle cx="130" cy="370" r="33" fill="#FFFFFF"/>
  </g>
  <path d="M 118 352 L 134 352 L 142 360 L 142 388 L 118 388 Z" fill="#1B75BB"/>
  <path d="M 134 352 L 134 360 L 142 360" fill="#2D9CDB"/>
  <g stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round">
    <path d="M 123 366 L 137 366"/>
    <path d="M 123 373 L 137 373"/>
    <path d="M 123 380 L 132 380"/>
  </g>
  <text x="130" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#21346B">Orders</text>

  <!-- left: Manufacturing (gear) -->
  <g filter="url(#shA)">
    <circle cx="80" cy="250" r="33" fill="#FFFFFF"/>
  </g>
  <g transform="translate(80,250)">
    <g transform="translate(-15,-15) scale(0.47)">
      <path d="M 34 0 L 40 0 L 43 12 L 55 6 L 62 13 L 56 25 L 68 28 L 68 34 L 56 37 L 62 49 L 55 56 L 43 50 L 40 62 L 34 62 L 31 50 L 19 56 L 12 49 L 18 37 L 6 34 L 6 28 L 18 25 L 12 13 L 19 6 L 31 12 Z" fill="#21346B"/>
    </g>
    <circle cx="0" cy="0" r="6" fill="#F7941D"/>
  </g>
  <text x="80" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#21346B">Manufacturing</text>

  <!-- top-left: POS (screen) -->
  <g filter="url(#shA)">
    <circle cx="130" cy="130" r="33" fill="#FFFFFF"/>
  </g>
  <rect x="112" y="116" width="36" height="24" rx="4" fill="#21346B"/>
  <rect x="116" y="120" width="28" height="16" rx="2" fill="#2D9CDB"/>
  <path d="M 130 140 L 130 146 M 122 150 L 138 150" stroke="#F7941D" stroke-width="3.5" stroke-linecap="round"/>
  <text x="130" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#21346B">POS</text>

  <!-- orbiting sparkles -->
  <path d="M 402 106 L 404.5 112.5 L 411 115 L 404.5 117.5 L 402 124 L 399.5 117.5 L 393 115 L 399.5 112.5 Z" fill="#FFB55A"/>
  <circle cx="96" cy="170" r="4" fill="#FFB55A"/>
  <circle cx="410" cy="404" r="4" fill="#2D9CDB" opacity="0.7"/>
</svg>
