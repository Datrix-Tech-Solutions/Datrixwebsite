<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 371" font-family="-apple-system, 'SF Pro Text', 'Rubik', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="popShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1d1d1f" flood-opacity="0.14"/>
    </filter>
  </defs>
  <style>
    .ink{fill:#1d1d1f}.gray{fill:#6e6e73}.faint{fill:#86868b}
    .h1{font-size:17px;font-weight:700;letter-spacing:-0.3px}
    .chrome{font-size:11px;font-weight:500}
    .chip{font-size:9.5px}
    .btn{font-size:10px;font-weight:500}
    .hd{font-size:9.5px;font-weight:600}
    .cell{font-size:9.5px}
    .num{font-size:9.5px}
    .totv{font-size:10px;font-weight:600;fill:#ffffff}
    .foot{font-size:9.5px}
    .cal{font-size:9px}
    .calh{font-size:8px;font-weight:500}
    .month{font-size:10.5px;font-weight:600}
  </style>

  <!-- window chrome -->
  <rect width="610" height="371" fill="#ffffff"/>
  <rect width="610" height="36" fill="#f5f5f7"/>
  <line x1="0" y1="36.5" x2="610" y2="36.5" stroke="#e8e8ed"/>
  <circle cx="20" cy="18" r="5.5" fill="#ff5f57"/>
  <circle cx="36" cy="18" r="5.5" fill="#febc2e"/>
  <circle cx="52" cy="18" r="5.5" fill="#28c840"/>
  <text x="305" y="22" text-anchor="middle" class="chrome gray">AccountingPhelo — Purchase</text>

  <!-- title + actions -->
  <text x="24" y="72" class="h1 ink">Purchase Order Analysis</text>
  <rect x="530" y="54" width="56" height="24" rx="12" fill="#1B75BB"/>
  <text x="558" y="69.5" text-anchor="middle" class="btn" fill="#ffffff">Save</text>
  <rect x="460" y="54" width="62" height="24" rx="12" fill="#ffffff" stroke="#e0e0e5"/>
  <text x="491" y="69.5" text-anchor="middle" class="btn gray">Export</text>
  <rect x="386" y="54" width="66" height="24" rx="12" fill="#ffffff" stroke="#e0e0e5"/>
  <text x="412" y="69.5" text-anchor="middle" class="btn gray">Views</text>
  <path d="M440 64 l3.5 4.5 l3.5 -4.5 Z" fill="#6e6e73"/>

  <!-- toolbar chips -->
  <rect x="24" y="86" width="104" height="22" rx="11" fill="#ffffff" stroke="#e8e8ed"/>
  <text x="76" y="100.5" text-anchor="middle" class="chip gray">Column Chooser</text>
  <rect x="136" y="86" width="88" height="22" rx="11" fill="#ffffff" stroke="#e8e8ed"/>
  <text x="180" y="100.5" text-anchor="middle" class="chip gray">Full Expand</text>
  <rect x="232" y="86" width="92" height="22" rx="11" fill="#ffffff" stroke="#e8e8ed"/>
  <text x="278" y="100.5" text-anchor="middle" class="chip gray">Full Collapse</text>

  <!-- grid header -->
  <rect x="24" y="120" width="562" height="28" fill="#f5f5f7"/>
  <g class="hd gray">
    <text x="34" y="138">Order No</text>
    <text x="82" y="138">Order Date</text>
    <text x="150" y="138">Party Name</text>
    <text x="238" y="138">Item Name</text>
    <text x="312" y="138">Godown Name</text>
    <text x="398" y="138">Batch Name</text>
    <text x="526" y="138" text-anchor="end">Ordered Qty</text>
    <text x="582" y="138" text-anchor="end">Pending Qty</text>
  </g>

  <!-- grid rows -->
  <g class="cell ink">
    <text x="34" y="162">1</text><text x="82" y="162">01-01-25</text><text x="150" y="162">Acme Traders</text><text x="238" y="162">Rods</text><text x="312" y="162">Main Location</text><text x="398" y="162">Primary batch</text>
    <text x="34" y="188">2</text><text x="82" y="188">04-01-25</text><text x="150" y="188">Monarch Mills</text><text x="238" y="188">Sheets</text><text x="312" y="188">Main Location</text><text x="398" y="188">Primary batch</text>
    <text x="34" y="214">3</text><text x="82" y="214">09-01-25</text><text x="150" y="214">Eagle Star</text><text x="238" y="214">Angles</text><text x="312" y="214">Star Factory</text><text x="398" y="214">Batch 07</text>
    <text x="34" y="240">4</text><text x="82" y="240">15-01-25</text><text x="150" y="240">Nova Supplies</text><text x="238" y="240">Rods</text><text x="312" y="240">Main Location</text><text x="398" y="240">Primary batch</text>
  </g>
  <g class="num ink" text-anchor="end">
    <text x="526" y="162">40</text><text x="582" y="162">12</text>
    <text x="526" y="188">100</text><text x="582" y="188">100</text>
    <text x="526" y="214">25</text><text x="582" y="214">0</text>
    <text x="526" y="240">6</text><text x="582" y="240">6</text>
  </g>
  <g stroke="#f0f0f2">
    <line x1="24" y1="171" x2="586" y2="171"/>
    <line x1="24" y1="197" x2="586" y2="197"/>
    <line x1="24" y1="223" x2="586" y2="223"/>
    <line x1="24" y1="249" x2="586" y2="249"/>
  </g>

  <!-- totals band -->
  <rect x="24" y="249" width="562" height="28" fill="#21346B"/>
  <text x="34" y="267" class="tot" font-size="9.5">Total</text>
  <text x="526" y="267" text-anchor="end" class="totv">171.00</text>
  <text x="582" y="267" text-anchor="end" class="totv">118.00</text>

  <!-- footer -->
  <text x="24" y="302" class="foot faint">Page 1 of 3 (9 items)</text>
  <g class="foot" text-anchor="middle">
    <text x="520" y="302" class="faint">‹</text>
    <text x="536" y="302" font-weight="600" fill="#1B75BB">1</text>
    <text x="552" y="302" class="faint">2</text>
    <text x="568" y="302" class="faint">3</text>
    <text x="582" y="302" class="faint">›</text>
  </g>

  <!-- date picker overlay -->
  <g filter="url(#popShadow)">
    <rect x="150" y="164" width="172" height="162" rx="10" fill="#ffffff" stroke="#ececf0"/>
  </g>
  <text x="164" y="188" class="faint">‹</text>
  <text x="236" y="188" text-anchor="middle" class="month ink">Jan 2025</text>
  <text x="308" y="188" class="faint">›</text>
  <g class="calh faint" text-anchor="middle">
    <text x="173" y="206">S</text><text x="194" y="206">M</text><text x="215" y="206">T</text><text x="236" y="206">W</text><text x="257" y="206">T</text><text x="278" y="206">F</text><text x="299" y="206">S</text>
  </g>
  <g class="cal ink" text-anchor="middle">
    <text x="215" y="224">1</text><text x="236" y="224">2</text><text x="257" y="224">3</text><text x="278" y="224">4</text>
    <text x="299" y="224">5</text><text x="173" y="242">6</text><text x="194" y="242">7</text><text x="215" y="242">8</text>
    <text x="236" y="242">9</text><text x="257" y="242">10</text>
    <circle cx="278" cy="256" r="8.5" fill="#F7941D"/>
    <text x="278" y="259.5" fill="#ffffff" font-weight="600">11</text>
    <text x="299" y="259.5">12</text>
    <text x="173" y="277">13</text><text x="194" y="277">14</text><text x="215" y="277">15</text><text x="236" y="277">16</text><text x="257" y="277">17</text><text x="278" y="277">18</text><text x="299" y="277">19</text>
    <text x="173" y="295">20</text><text x="194" y="295">21</text><text x="215" y="295">22</text><text x="236" y="295">23</text><text x="257" y="295">24</text><text x="278" y="295">25</text><text x="299" y="295">26</text>
  </g>
  <rect x="198" y="304" width="76" height="20" rx="10" fill="#1B75BB"/>
  <text x="236" y="317.5" text-anchor="middle" font-size="9.5" font-weight="500" fill="#ffffff">Apply</text>
</svg>
