<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 371" font-family="-apple-system, 'SF Pro Text', 'Rubik', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <style>
    .ink{fill:#1d1d1f}.gray{fill:#6e6e73}.faint{fill:#86868b}
    .h1{font-size:20px;font-weight:700;letter-spacing:-0.4px}
    .chrome{font-size:11px;font-weight:500}
    .chk{font-size:9.5px}
    .btn{font-size:10px;font-weight:500}
    .lb{font-size:9.5px;font-weight:500}
    .fv{font-size:10px}
    .hd{font-size:9.5px;font-weight:600}
    .ph{font-size:10px}
  </style>

  <!-- window chrome -->
  <rect width="610" height="371" fill="#ffffff"/>
  <rect width="610" height="36" fill="#f5f5f7"/>
  <line x1="0" y1="36.5" x2="610" y2="36.5" stroke="#e8e8ed"/>
  <circle cx="20" cy="18" r="5.5" fill="#ff5f57"/>
  <circle cx="36" cy="18" r="5.5" fill="#febc2e"/>
  <circle cx="52" cy="18" r="5.5" fill="#28c840"/>
  <text x="305" y="22" text-anchor="middle" class="chrome gray">AccountingPhelo — Point of Sale</text>

  <!-- title + controls -->
  <text x="24" y="74" class="h1 ink">POS</text>
  <rect x="316" y="58" width="10" height="10" rx="2.5" fill="#ffffff" stroke="#c7c7cc"/>
  <text x="332" y="67" class="chk gray">Optional</text>
  <rect x="382" y="58" width="10" height="10" rx="2.5" fill="#ffffff" stroke="#c7c7cc"/>
  <text x="398" y="67" class="chk gray">Post Dated</text>
  <rect x="452" y="52" width="50" height="24" rx="12" fill="#1B75BB"/>
  <text x="477" y="67.5" text-anchor="middle" class="btn" fill="#ffffff">Save</text>
  <rect x="510" y="52" width="24" height="24" rx="8" fill="#ffffff" stroke="#e0e0e5"/>
  <g stroke="#6e6e73" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M522 66 v-6 M519.5 62.5 l2.5 -2.5 l2.5 2.5 M517.5 68.5 h9"/>
  </g>
  <rect x="542" y="52" width="24" height="24" rx="8" fill="#ffffff" stroke="#e0e0e5"/>
  <g stroke="#6e6e73" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M548 58 h12 v6 h-12 Z M550 64 v6 h8 v-6 M552 58 v-2.5 h4 V58"/>
  </g>

  <!-- form row 1 -->
  <text x="24" y="102" class="lb gray">Date</text>
  <rect x="24" y="108" width="180" height="24" rx="6" fill="#f5f5f7"/>
  <text x="34" y="123.5" class="fv ink">1st Mar 2025</text>
  <path d="M188 117.5 l4 5 l4 -5 Z" fill="#1B75BB"/>
  <text x="224" y="102" class="lb gray">No</text>
  <rect x="224" y="108" width="180" height="24" rx="6" fill="#f5f5f7"/>
  <text x="234" y="123.5" class="fv ink">5</text>
  <text x="424" y="102" class="lb gray">Currency</text>
  <rect x="424" y="108" width="162" height="24" rx="6" fill="#f5f5f7"/>
  <text x="434" y="123.5" class="fv ink">INR</text>
  <path d="M568 117.5 l4 5 l4 -5 Z" fill="#1B75BB"/>

  <!-- form row 2 -->
  <text x="24" y="144" class="lb gray">Ref no</text>
  <rect x="24" y="150" width="180" height="24" rx="6" fill="#f5f5f7"/>
  <text x="34" y="165.5" class="fv ink">5</text>
  <text x="224" y="144" class="lb gray">Price level</text>
  <rect x="224" y="150" width="180" height="24" rx="6" fill="#f5f5f7"/>
  <text x="234" y="165.5" class="fv faint">Not Applicable</text>
  <path d="M388 159.5 l4 5 l4 -5 Z" fill="#1B75BB"/>
  <text x="424" y="144" class="lb gray">Project</text>
  <rect x="424" y="150" width="162" height="24" rx="6" fill="#f5f5f7"/>
  <text x="434" y="165.5" class="fv faint">Not Applicable</text>
  <path d="M568 159.5 l4 5 l4 -5 Z" fill="#1B75BB"/>

  <!-- form row 3 -->
  <text x="24" y="186" class="lb gray">Party's A/c name</text>
  <rect x="24" y="192" width="370" height="24" rx="6" fill="#f5f5f7"/>
  <text x="34" y="207.5" class="fv ink">Akbar Traders — Dr</text>
  <path d="M376 201.5 l4 5 l4 -5 Z" fill="#1B75BB"/>
  <text x="424" y="186" class="lb gray">Current Bal</text>
  <rect x="424" y="192" width="162" height="24" rx="6" fill="#ffffff" stroke="#e0e0e5"/>
  <text x="434" y="207.5" class="fv ink" font-weight="600">479,707.30 Dr</text>

  <!-- items grid -->
  <rect x="24" y="232" width="536" height="24" fill="#f5f5f7"/>
  <g class="hd gray">
    <text x="34" y="248">Item Name</text>
    <text x="330" y="248" text-anchor="end">Quantity</text>
    <text x="350" y="248">Rate Per</text>
    <text x="550" y="248" text-anchor="end">Discount Amt</text>
  </g>
  <line x1="24" y1="256.5" x2="560" y2="256.5" stroke="#e8e8ed"/>
  <text x="34" y="273" class="ph ink">126</text>
  <text x="330" y="273" text-anchor="end" class="ph ink">20.00</text>
  <text x="350" y="273" class="ph ink">K</text>
  <path d="M360 268.5 l4 5 l4 -5 Z" fill="#1B75BB"/>
  <text x="550" y="273" text-anchor="end" class="ph ink">0</text>
  <rect x="566" y="260" width="14" height="14" rx="4" fill="#F7941D"/>
  <text x="573" y="270.5" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">+</text>
  <line x1="24" y1="282.5" x2="560" y2="282.5" stroke="#f0f0f2"/>

  <!-- narration -->
  <rect x="24" y="294" width="562" height="24" rx="6" fill="#f5f5f7"/>
  <text x="34" y="309.5" class="ph faint">Narration</text>

  <!-- actions -->
  <rect x="24" y="330" width="64" height="26" rx="13" fill="#1B75BB"/>
  <text x="56" y="346.5" text-anchor="middle" class="btn" fill="#ffffff">Save</text>
  <rect x="96" y="330" width="64" height="26" rx="13" fill="#ffffff" stroke="#e0e0e5"/>
  <text x="128" y="346.5" text-anchor="middle" class="btn gray">Cancel</text>
</svg>
