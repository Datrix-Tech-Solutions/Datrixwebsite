<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 371" font-family="-apple-system, 'SF Pro Text', 'Rubik', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1d1d1f" flood-opacity="0.07"/>
    </filter>
  </defs>
  <style>
    .ink{fill:#1d1d1f}.gray{fill:#6e6e73}.faint{fill:#86868b}
    .h1{font-size:20px;font-weight:700;letter-spacing:-0.4px}
    .chrome{font-size:11px;font-weight:500}
    .ghdr{font-size:10.5px;font-weight:600}
    .sub{font-size:10px}
    .date{font-size:9px}
    .lbl{font-size:11px}
    .num{font-size:10.5px}
    .val{font-size:11px;font-weight:500}
    .btn{font-size:10px;font-weight:500}
    .tot{font-size:10px;font-weight:600;fill:#ffffff;letter-spacing:0.6px}
    .totv{font-size:11.5px;font-weight:600;fill:#ffffff}
    .foot{font-size:9.5px}
  </style>

  <!-- window chrome -->
  <rect width="610" height="371" fill="#ffffff"/>
  <rect width="610" height="36" fill="#f5f5f7"/>
  <line x1="0" y1="36.5" x2="610" y2="36.5" stroke="#e8e8ed"/>
  <circle cx="20" cy="18" r="5.5" fill="#ff5f57"/>
  <circle cx="36" cy="18" r="5.5" fill="#febc2e"/>
  <circle cx="52" cy="18" r="5.5" fill="#28c840"/>
  <text x="305" y="22" text-anchor="middle" class="chrome gray">AccountingPhelo — Inventory</text>

  <!-- title + actions -->
  <text x="24" y="74" class="h1 ink">Stock Summary</text>
  <rect x="358" y="54" width="78" height="24" rx="12" fill="#1B75BB"/>
  <text x="397" y="69.5" text-anchor="middle" class="btn" fill="#ffffff">Customize</text>
  <rect x="444" y="54" width="64" height="24" rx="12" fill="#ffffff" stroke="#e0e0e5"/>
  <text x="476" y="69.5" text-anchor="middle" class="btn gray">Refresh</text>
  <rect x="516" y="54" width="70" height="24" rx="12" fill="#ffffff" stroke="#e0e0e5"/>
  <text x="551" y="69.5" text-anchor="middle" class="btn gray">Export</text>

  <!-- table -->
  <rect x="24" y="94" width="562" height="26" fill="#f5f5f7"/>
  <text x="38" y="111" class="ghdr ink">Particulars</text>
  <text x="400" y="111" text-anchor="middle" class="ghdr ink">Closing Balance</text>
  <text x="578" y="111" text-anchor="end" class="date faint">1st Apr 2024 – 31st Mar 2025</text>
  <line x1="24" y1="120.5" x2="586" y2="120.5" stroke="#e8e8ed"/>
  <text x="336" y="136" text-anchor="end" class="sub gray">Quantity</text>
  <text x="456" y="136" text-anchor="end" class="sub gray">Eff. Rate</text>
  <text x="578" y="136" text-anchor="end" class="sub gray">Value</text>

  <!-- rows -->
  <rect x="24" y="144" width="562" height="30" fill="#fafafa"/>
  <text x="38" y="163" class="lbl ink">Finished Goods</text>
  <text x="578" y="163" text-anchor="end" class="val ink">1,198,638.76</text>
  <line x1="24" y1="174.5" x2="586" y2="174.5" stroke="#f0f0f2"/>
  <text x="38" y="193" class="lbl ink">Raw Material</text>
  <text x="336" y="193" text-anchor="end" class="num gray">354.64 K</text>
  <text x="456" y="193" text-anchor="end" class="num gray">2,081.48</text>
  <text x="578" y="193" text-anchor="end" class="val ink">738,177.17</text>
  <line x1="24" y1="204.5" x2="586" y2="204.5" stroke="#f0f0f2"/>
  <rect x="24" y="204" width="562" height="30" fill="#fafafa"/>
  <text x="38" y="223" class="lbl ink">Spare Parts</text>
  <text x="336" y="223" text-anchor="end" class="num gray">500 Pcs</text>
  <text x="456" y="223" text-anchor="end" class="num gray">50.00</text>
  <text x="578" y="223" text-anchor="end" class="val ink">25,000.00</text>
  <line x1="24" y1="234.5" x2="586" y2="234.5" stroke="#f0f0f2"/>
  <text x="38" y="253" class="lbl ink">Bajaz</text>
  <text x="336" y="253" text-anchor="end" class="num gray">150 Pcs</text>
  <text x="456" y="253" text-anchor="end" class="num gray">143.33</text>
  <text x="578" y="253" text-anchor="end" class="val ink">21,500.00</text>
  <line x1="24" y1="264.5" x2="586" y2="264.5" stroke="#f0f0f2"/>
  <rect x="24" y="264" width="562" height="30" fill="#fafafa"/>
  <text x="38" y="283" class="lbl ink">I05</text>
  <text x="336" y="283" text-anchor="end" class="num gray">47.00 K</text>
  <text x="456" y="283" text-anchor="end" class="num gray">5.10</text>
  <text x="578" y="283" text-anchor="end" class="val ink">240.00</text>

  <!-- total -->
  <path d="M24 324 q0 -10 10 -10 h542 q10 0 10 10 q0 10 -10 10 h-542 q-10 0 -10 -10 Z" fill="#21346B"/>
  <text x="38" y="328" class="tot">TOTAL</text>
  <text x="578" y="328" text-anchor="end" class="totv">1,983,555.93</text>

  <text x="305" y="356" text-anchor="middle" class="foot faint">Valuation: FIFO · live stock sync across stores and warehouses</text>
</svg>
