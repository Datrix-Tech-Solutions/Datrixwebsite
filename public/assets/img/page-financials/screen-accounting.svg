<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 371" font-family="-apple-system, 'SF Pro Text', 'Rubik', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1d1d1f" flood-opacity="0.07"/>
    </filter>
  </defs>
  <style>
    .ink{fill:#1d1d1f}.gray{fill:#6e6e73}.faint{fill:#86868b}
    .h1{font-size:20px;font-weight:700;letter-spacing:-0.4px}
    .chrome{font-size:11px;font-weight:500}
    .colhead{font-size:11px;font-weight:600;letter-spacing:0.1px}
    .date{font-size:9.5px}
    .lbl{font-size:11px}
    .val{font-size:11px;font-weight:500}
    .tot{font-size:10px;font-weight:600;fill:#ffffff;letter-spacing:0.6px}
    .totv{font-size:11.5px;font-weight:600;fill:#ffffff}
    .btn{font-size:10px;font-weight:500}
    .foot{font-size:9.5px}
  </style>

  <!-- window chrome -->
  <rect width="610" height="371" fill="#ffffff"/>
  <rect width="610" height="36" fill="#f5f5f7"/>
  <line x1="0" y1="36.5" x2="610" y2="36.5" stroke="#e8e8ed"/>
  <circle cx="20" cy="18" r="5.5" fill="#ff5f57"/>
  <circle cx="36" cy="18" r="5.5" fill="#febc2e"/>
  <circle cx="52" cy="18" r="5.5" fill="#28c840"/>
  <text x="305" y="22" text-anchor="middle" class="chrome gray">AccountingPhelo — Accounting</text>

  <!-- title + actions -->
  <text x="24" y="74" class="h1 ink">Balance Sheet</text>
  <rect x="358" y="54" width="78" height="24" rx="12" fill="#1B75BB"/>
  <text x="397" y="69.5" text-anchor="middle" class="btn" fill="#ffffff">Customize</text>
  <rect x="444" y="54" width="64" height="24" rx="12" fill="#ffffff" stroke="#e0e0e5"/>
  <text x="476" y="69.5" text-anchor="middle" class="btn gray">Refresh</text>
  <rect x="516" y="54" width="70" height="24" rx="12" fill="#ffffff" stroke="#e0e0e5"/>
  <text x="551" y="69.5" text-anchor="middle" class="btn gray">Export</text>

  <!-- Liabilities card -->
  <g filter="url(#cardShadow)">
    <rect x="24" y="94" width="271" height="206" rx="10" fill="#ffffff" stroke="#ececf0"/>
  </g>
  <text x="38" y="116" class="colhead ink">Liabilities</text>
  <text x="281" y="116" text-anchor="end" class="date faint">As at 31 Mar 2025</text>
  <line x1="24" y1="128" x2="295" y2="128" stroke="#ececf0"/>
  <text x="38" y="151" class="lbl" fill="#1B75BB">Share Capital Account</text>
  <text x="281" y="151" text-anchor="end" class="val ink">11,435,294.00</text>
  <line x1="38" y1="163" x2="281" y2="163" stroke="#f0f0f2"/>
  <text x="38" y="186" class="lbl" fill="#1B75BB">Loans (Liability)</text>
  <text x="281" y="186" text-anchor="end" class="val ink">3,456,300.00</text>
  <line x1="38" y1="198" x2="281" y2="198" stroke="#f0f0f2"/>
  <text x="38" y="221" class="lbl" fill="#1B75BB">Current Liabilities</text>
  <text x="281" y="221" text-anchor="end" class="val ink">8,916,660.70</text>
  <line x1="38" y1="233" x2="281" y2="233" stroke="#f0f0f2"/>
  <text x="38" y="256" class="lbl" fill="#1B75BB">Profit &amp; Loss A/C</text>
  <text x="281" y="256" text-anchor="end" class="val ink">546,334.39</text>
  <path d="M24 290 q0 -10 10 -10 h251 q10 0 10 10 v0 q0 10 -10 10 h-251 q-10 0 -10 -10 Z" fill="#21346B"/>
  <rect x="24" y="280" width="271" height="10" fill="#21346B"/>
  <text x="38" y="294" class="tot">TOTAL</text>
  <text x="281" y="294" text-anchor="end" class="totv">24,354,589.09</text>

  <!-- Assets card -->
  <g filter="url(#cardShadow)">
    <rect x="315" y="94" width="271" height="206" rx="10" fill="#ffffff" stroke="#ececf0"/>
  </g>
  <text x="329" y="116" class="colhead ink">Assets</text>
  <text x="572" y="116" text-anchor="end" class="date faint">As at 31 Mar 2025</text>
  <line x1="315" y1="128" x2="586" y2="128" stroke="#ececf0"/>
  <text x="329" y="151" class="lbl" fill="#1B75BB">Fixed Assets</text>
  <text x="572" y="151" text-anchor="end" class="val ink">14,152,628.92</text>
  <line x1="329" y1="163" x2="572" y2="163" stroke="#f0f0f2"/>
  <text x="329" y="186" class="lbl" fill="#1B75BB">Investments</text>
  <text x="572" y="186" text-anchor="end" class="val ink">3,800,000.00</text>
  <line x1="329" y1="198" x2="572" y2="198" stroke="#f0f0f2"/>
  <text x="329" y="221" class="lbl" fill="#1B75BB">Current Assets</text>
  <text x="572" y="221" text-anchor="end" class="val ink">5,764,811.82</text>
  <line x1="329" y1="233" x2="572" y2="233" stroke="#f0f0f2"/>
  <text x="329" y="256" class="lbl" fill="#1B75BB">Branch / Divisions</text>
  <text x="572" y="256" text-anchor="end" class="val ink">637,148.35</text>
  <path d="M315 290 q0 -10 10 -10 h251 q10 0 10 10 v0 q0 10 -10 10 h-251 q-10 0 -10 -10 Z" fill="#21346B"/>
  <rect x="315" y="280" width="271" height="10" fill="#21346B"/>
  <text x="329" y="294" class="tot">TOTAL</text>
  <text x="572" y="294" text-anchor="end" class="totv">24,354,589.09</text>

  <text x="305" y="333" text-anchor="middle" class="foot faint">Statements generated straight from the general ledger · figures in INR</text>
</svg>
