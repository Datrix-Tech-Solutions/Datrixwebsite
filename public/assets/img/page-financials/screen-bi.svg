<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 371" font-family="-apple-system, 'SF Pro Text', 'Rubik', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="biArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2D9CDB" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2D9CDB" stop-opacity="0"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1d1d1f" flood-opacity="0.07"/>
    </filter>
  </defs>
  <style>
    .ink{fill:#1d1d1f}.gray{fill:#6e6e73}.faint{fill:#86868b}
    .h1{font-size:20px;font-weight:700;letter-spacing:-0.4px}
    .chrome{font-size:11px;font-weight:500}
    .cl{font-size:10.5px;font-weight:600}
    .bl{font-size:8.5px}
    .ax{font-size:8px}
    .lg{font-size:8.5px}
    .card-l{font-size:9.5px;font-weight:600}
    .card-v{font-size:10px;font-weight:600}
  </style>

  <!-- window chrome -->
  <rect width="610" height="371" fill="#ffffff"/>
  <rect width="610" height="36" fill="#f5f5f7"/>
  <line x1="0" y1="36.5" x2="610" y2="36.5" stroke="#e8e8ed"/>
  <circle cx="20" cy="18" r="5.5" fill="#ff5f57"/>
  <circle cx="36" cy="18" r="5.5" fill="#febc2e"/>
  <circle cx="52" cy="18" r="5.5" fill="#28c840"/>
  <text x="305" y="22" text-anchor="middle" class="chrome gray">AccountingPhelo — Insights</text>

  <text x="24" y="72" class="h1 ink">Business Intelligence</text>

  <!-- left bar chart -->
  <text x="24" y="98" class="cl ink">Top 10 Products (QTY)</text>
  <g class="bl gray" text-anchor="end">
    <text x="104" y="115.5">Bread</text>
    <text x="104" y="133.5">Wheat</text>
    <text x="104" y="151.5">Maize</text>
    <text x="104" y="169.5">Rice</text>
    <text x="104" y="187.5">Gram</text>
    <text x="104" y="205.5">Millet</text>
  </g>
  <rect x="110" y="108" width="190" height="10" rx="3" fill="#1B75BB"/>
  <rect x="110" y="126" width="152" height="10" rx="3" fill="#2D9CDB"/>
  <rect x="110" y="144" width="118" height="10" rx="3" fill="#2D9CDB"/>
  <rect x="110" y="162" width="92" height="10" rx="3" fill="#8FCBEA"/>
  <rect x="110" y="180" width="68" height="10" rx="3" fill="#8FCBEA"/>
  <rect x="110" y="198" width="46" height="10" rx="3" fill="#B7DFF5"/>
  <line x1="110" y1="214" x2="300" y2="214" stroke="#ececf0"/>
  <text x="110" y="226" class="ax faint">0%</text>
  <text x="300" y="226" text-anchor="end" class="ax faint">100%</text>

  <!-- right bar chart -->
  <text x="326" y="98" class="cl ink">Top 10 Products (AMT)</text>
  <g class="bl gray" text-anchor="end">
    <text x="396" y="115.5">Bread</text>
    <text x="396" y="133.5">Wheat</text>
    <text x="396" y="151.5">Maize</text>
    <text x="396" y="169.5">Rice</text>
    <text x="396" y="187.5">Gram</text>
    <text x="396" y="205.5">Millet</text>
  </g>
  <rect x="402" y="108" width="184" height="10" rx="3" fill="#F7941D"/>
  <rect x="402" y="126" width="140" height="10" rx="3" fill="#1B75BB"/>
  <rect x="402" y="144" width="112" height="10" rx="3" fill="#2D9CDB"/>
  <rect x="402" y="162" width="88" height="10" rx="3" fill="#8FCBEA"/>
  <rect x="402" y="180" width="64" height="10" rx="3" fill="#8FCBEA"/>
  <rect x="402" y="198" width="42" height="10" rx="3" fill="#B7DFF5"/>
  <line x1="402" y1="214" x2="586" y2="214" stroke="#ececf0"/>
  <text x="402" y="226" class="ax faint">0%</text>
  <text x="586" y="226" text-anchor="end" class="ax faint">100%</text>

  <!-- expense donut -->
  <text x="24" y="252" class="cl ink">Expense</text>
  <g transform="rotate(-90 88 306)" fill="none" stroke-width="16">
    <circle cx="88" cy="306" r="34" stroke="#21346B" stroke-dasharray="55.54 213.63" stroke-dashoffset="0"/>
    <circle cx="88" cy="306" r="34" stroke="#1B75BB" stroke-dasharray="38.45 213.63" stroke-dashoffset="-55.54"/>
    <circle cx="88" cy="306" r="34" stroke="#F7941D" stroke-dasharray="34.18 213.63" stroke-dashoffset="-93.99"/>
    <circle cx="88" cy="306" r="34" stroke="#2D9CDB" stroke-dasharray="29.91 213.63" stroke-dashoffset="-128.17"/>
    <circle cx="88" cy="306" r="34" stroke="#2E9E6B" stroke-dasharray="25.64 213.63" stroke-dashoffset="-158.08"/>
    <circle cx="88" cy="306" r="34" stroke="#c7c7cc" stroke-dasharray="29.91 213.63" stroke-dashoffset="-183.72"/>
  </g>
  <g class="lg gray">
    <circle cx="153" cy="271" r="3.5" fill="#21346B"/><text x="162" y="274">Salary</text>
    <circle cx="153" cy="289" r="3.5" fill="#1B75BB"/><text x="162" y="292">IT Support</text>
    <circle cx="153" cy="307" r="3.5" fill="#2D9CDB"/><text x="162" y="310">Medical</text>
    <circle cx="153" cy="325" r="3.5" fill="#c7c7cc"/><text x="162" y="328">Subscription</text>
    <circle cx="266" cy="271" r="3.5" fill="#F7941D"/><text x="275" y="274">Professional &amp; Outsourcing</text>
    <circle cx="266" cy="289" r="3.5" fill="#2E9E6B"/><text x="275" y="292">Traveling</text>
  </g>

  <!-- profitability card -->
  <g filter="url(#cardShadow)">
    <rect x="390" y="244" width="196" height="112" rx="10" fill="#ffffff" stroke="#ececf0"/>
  </g>
  <text x="402" y="264" class="card-l ink">Profitability</text>
  <text x="574" y="264" text-anchor="end" class="card-v" fill="#2E9E6B">+18.4% YoY</text>
  <path d="M402 324 L426 318 L450 320 L474 308 L498 310 L522 298 L546 296 L574 284 L574 336 L402 336 Z" fill="url(#biArea)"/>
  <path d="M402 324 L426 318 L450 320 L474 308 L498 310 L522 298 L546 296 L574 284" fill="none" stroke="#1B75BB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="574" cy="284" r="3" fill="#F7941D" stroke="#ffffff" stroke-width="1.5"/>
</svg>
