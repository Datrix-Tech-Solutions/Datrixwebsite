<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" fill="none">
  <defs>
    <linearGradient id="gWc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3FB3EA"/>
      <stop offset="1" stop-color="#1173B4"/>
    </linearGradient>
    <filter id="shX" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#0A3D66" flood-opacity="0.20"/>
    </filter>
    <filter id="shX2" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0A3D66" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- halo backdrop -->
  <ellipse cx="420" cy="280" rx="230" ry="214" fill="#D9EDFB"/>
  <circle cx="110" cy="98" r="22" fill="#D9EDFB"/>
  <circle cx="712" cy="420" r="15" fill="#D9EDFB"/>

  <!-- ground shadow -->
  <ellipse cx="400" cy="514" rx="268" ry="15" fill="#0A3D66" opacity="0.10"/>

  <!-- main blob -->
  <path d="M 402 46 C 510 40 614 88 654 172 C 692 254 686 344 632 408 C 580 470 496 500 402 496 C 308 492 224 462 182 392 C 140 322 144 232 188 164 C 234 94 310 52 402 46 Z" fill="url(#gWc)"/>

  <!-- tone-on-tone clouds -->
  <g fill="#0F6BA8" opacity="0.5">
    <g transform="translate(196,120)">
      <rect x="0" y="0" width="52" height="13" rx="6.5"/>
      <circle cx="13" cy="-3" r="7"/>
      <circle cx="29" cy="-2" r="6"/>
    </g>
    <g transform="translate(576,438)">
      <rect x="0" y="0" width="44" height="12" rx="6"/>
      <circle cx="11" cy="-3" r="6"/>
      <circle cx="24" cy="-2" r="5"/>
    </g>
  </g>

  <!-- floating dots + sparkle -->
  <circle cx="128" cy="190" r="4" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="676" cy="180" r="3" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="118" cy="330" r="3" fill="#FFFFFF" opacity="0.65"/>
  <circle cx="612" cy="86" r="4" fill="#FFB55A"/>
  <path d="M 152 246 L 154.5 252.5 L 161 255 L 154.5 257.5 L 152 264 L 149.5 257.5 L 143 255 L 149.5 252.5 Z" fill="#FFFFFF" opacity="0.9"/>
  <path d="M 636 246 L 638 251 L 643 253 L 638 255 L 636 260 L 634 255 L 629 253 L 634 251 Z" fill="#FFB55A" opacity="0.9"/>

  <!-- leaves -->
  <g transform="translate(96,408)">
    <ellipse cx="0" cy="0" rx="24" ry="9" transform="rotate(35)" fill="#1E7A52"/>
    <ellipse cx="-11" cy="10" rx="18" ry="7" transform="rotate(12)" fill="#57B98A"/>
  </g>

  <!-- ======== modular CRM frame (centre) ======== -->
  <g filter="url(#shX)">
    <rect x="258" y="112" width="288" height="232" rx="14" fill="#FFFFFF"/>
  </g>
  <path d="M 258 126 C 258 118 264 112 272 112 L 532 112 C 540 112 546 118 546 126 L 546 148 L 258 148 Z" fill="#21346B"/>
  <circle cx="274" cy="130" r="4.5" fill="#F7941D"/>
  <circle cx="288" cy="130" r="4.5" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="302" cy="130" r="4.5" fill="#57B98A"/>
  <rect x="356" y="124" width="110" height="11" rx="5.5" fill="#FFFFFF" opacity="0.22"/>

  <!-- module slot 1: filled sales pipeline -->
  <g transform="translate(278,166)">
    <rect x="0" y="0" width="120" height="76" rx="9" fill="#F2F7FC"/>
    <rect x="10" y="10" width="52" height="9" rx="4.5" fill="#1B75BB"/>
    <g>
      <rect x="10" y="28" width="26" height="34" rx="4" fill="#2D9CDB"/>
      <rect x="42" y="36" width="26" height="26" rx="4" fill="#1B75BB"/>
