    <circle cx="102" cy="14" r="7" fill="#2E9E6B"/>
    <path d="M 99 14 L 101.5 16.5 L 106 11.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- module slot 2: filled marketing -->
  <g transform="translate(412,166)">
    <rect x="0" y="0" width="120" height="76" rx="9" fill="#F2F7FC"/>
    <rect x="10" y="10" width="52" height="9" rx="4.5" fill="#F7941D"/>
    <path d="M 12 30 L 12 54 L 30 54 L 30 44 L 48 44 L 48 54 L 66 54 L 66 36 L 84 36 L 84 54 L 102 54 L 102 26" stroke="#F7941D" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="102" cy="14" r="7" fill="#2E9E6B"/>
    <path d="M 99 14 L 101.5 16.5 L 106 11.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- module slot 3: being filled by character (empty with dashed outline) -->
  <g transform="translate(278,254)">
    <rect x="0" y="0" width="120" height="70" rx="9" fill="#FFFFFF" stroke="#2D9CDB" stroke-width="2.5" stroke-dasharray="6 6"/>
    <g stroke="#9FB4D8" stroke-width="3.5" stroke-linecap="round">
      <path d="M 46 26 L 74 26 M 60 26 L 60 44 M 52 38 L 68 38"/>
    </g>
  </g>

  <!-- module slot 4: filled support -->
  <g transform="translate(412,254)">
    <rect x="0" y="0" width="120" height="70" rx="9" fill="#F2F7FC"/>
    <circle cx="28" cy="30" r="13" fill="#2E9E6B"/>
    <path d="M 20 30 C 20 20 36 20 36 30 M 16 30 C 16 36 22 42 28 42 C 34 42 40 36 40 30" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>
    <rect x="52" y="20" width="52" height="8" rx="4" fill="#21346B"/>
    <rect x="52" y="34" width="38" height="7" rx="3.5" fill="#9FB4D8"/>
    <rect x="52" y="46" width="44" height="7" rx="3.5" fill="#D9E4F1"/>
  </g>

  <!-- ======== sliders chip (top right) ======== -->
  <g transform="translate(590,128) rotate(8)" filter="url(#shX2)">
    <rect x="0" y="0" width="72" height="78" rx="12" fill="#FFFFFF"/>
    <path d="M 12 22 L 60 22" stroke="#D9E4F1" stroke-width="5" stroke-linecap="round"/>
    <circle cx="24" cy="22" r="8" fill="#F7941D"/>
    <path d="M 12 42 L 60 42" stroke="#D9E4F1" stroke-width="5" stroke-linecap="round"/>
    <circle cx="46" cy="42" r="8" fill="#1B75BB"/>
    <path d="M 12 62 L 60 62" stroke="#D9E4F1" stroke-width="5" stroke-linecap="round"/>
    <circle cx="34" cy="62" r="8" fill="#2E9E6B"/>
  </g>

  <!-- ======== price tag chip (bottom left) ======== -->
  <g transform="translate(150,388) rotate(-10)" filter="url(#shX2)">
    <path d="M 6 10 C 6 7 8 5 11 5 L 34 5 L 62 26 L 34 47 L 11 47 C 8 47 6 45 6 42 Z" fill="#F7941D"/>
    <circle cx="17" cy="15" r="4" fill="#FFFFFF"/>
    <rect x="22" y="20" width="26" height="5" rx="2.5" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <!-- ======== male placing module into empty slot ======== -->
  <g>
    <ellipse cx="600" cy="500" rx="34" ry="6" fill="#0A3D66" opacity="0.12"/>
    <path d="M 590 494 C 596 472 600 452 600 432" stroke="#16324F" stroke-width="10" stroke-linecap="round"/>
    <path d="M 612 496 C 610 474 608 452 608 432" stroke="#1E3A5F" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="586" cy="498" rx="9" ry="4.5" transform="rotate(-16 586 498)" fill="#10253F"/>
    <ellipse cx="616" cy="500" rx="9" ry="4.5" fill="#10253F"/>
    <path d="M 584 436 C 582 410 584 392 590 384 C 596 378 618 378 624 384 C 630 392 631 410 628 436 Z" fill="#F7941D"/>
    <path d="M 590 392 C 580 400 576 410 574 422" stroke="#F7941D" stroke-width="9" stroke-linecap="round"/>
    <path d="M 626 392 C 616 400 612 410 610 422" stroke="#F7941D" stroke-width="9" stroke-linecap="round" transform="translate(0,0)"/>
    <circle cx="573" cy="426" r="5" fill="#C98850"/>
    <circle cx="609" cy="426" r="5" fill="#C98850"/>
    <circle cx="606" cy="366" r="14" fill="#C98850"/>
    <path d="M 592 364 C 592 350 620 348 620 364 C 620 369 618 372 615 374 C 617 367 613 361 606 361 C 599 361 595 366 596 374 C 593 371 592 368 592 364 Z" fill="#16324F"/>
    <circle cx="610" cy="368" r="2.4" fill="#5C3A1E"/>
    <!-- module piece held out toward frame -->
    <g transform="translate(528,300) rotate(-14)" filter="url(#shX2)">
      <rect x="0" y="0" width="64" height="48" rx="8" fill="#FFFFFF" stroke="#2D9CDB" stroke-width="3"/>
      <rect x="9" y="9" width="28" height="9" rx="4.5" fill="#2D9CDB"/>
      <rect x="9" y="26" width="40" height="6" rx="3" fill="#D9E4F1"/>
      <rect x="9" y="36" width="30" height="6" rx="3" fill="#D9E4F1"/>
    </g>
  </g>

  <!-- plant right edge -->
  <g transform="translate(716,462)">
    <path d="M 0 0 C -2 -10 -4 -18 -9 -28 M 4 0 C 6 -8 8 -16 12 -24" stroke="#2E7D52" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="-11" cy="-30" rx="10" ry="4.5" transform="rotate(-32 -11 -30)" fill="#2E9E6B"/>
    <ellipse cx="14" cy="-26" rx="10" ry="4.5" transform="rotate(30 14 -26)" fill="#57B98A"/>
  </g>
</svg>
