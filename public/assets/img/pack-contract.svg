<svg xmlns="http://www.w3.org/2000/svg" width="260" height="275" viewBox="0 0 340 360" fill="none">
  <defs>
    <linearGradient id="pcB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3FB3EA"/>
      <stop offset="1" stop-color="#1173B4"/>
    </linearGradient>
    <filter id="pcS" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#061B33" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="172" cy="338" rx="128" ry="12" fill="#061B33" opacity="0.35"/>

  <!-- box side panel -->
  <path d="M 260 62 L 296 84 L 296 330 L 260 316 Z" fill="#C8D6EA"/>
  <!-- box top flap -->
  <path d="M 44 62 L 80 44 L 296 44 L 260 62 Z" fill="#DEE7F2"/>
  <!-- box front -->
  <g filter="url(#pcS)">
    <rect x="44" y="62" width="216" height="254" rx="6" fill="#FFFFFF"/>
  </g>
  <rect x="44" y="62" width="216" height="14" fill="#F4F8FC"/>

  <!-- Datrix brand row -->
  <g transform="translate(60,88)">
    <circle cx="12" cy="12" r="12" fill="#F7941D"/>
    <path d="M 12 3 L 18.5 19 L 12 15 L 5.5 19 Z" fill="#21346B"/>
    <text x="32" y="12" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#21346B">Datrix</text>
    <text x="32" y="24" font-family="Arial, sans-serif" font-size="6.5" fill="#5C6B8A" letter-spacing="1.4">TECH SOLUTIONS</text>
  </g>

  <!-- product wordmark -->
  <text x="60" y="146" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#21346B">Customized Software</text>
  <rect x="60" y="156" width="52" height="5" rx="2.5" fill="#2E9E6B"/>

  <!-- mini scene window -->
  <g transform="translate(60,176)">
    <rect x="0" y="0" width="184" height="106" rx="10" fill="#EAF4FB"/>
    <path d="M 12 96 C 66 84 76 28 172 20 L 172 96 Z" fill="url(#pcB)" opacity="0.16"/>
    <!-- code editor -->
    <rect x="14" y="14" width="98" height="78" rx="7" fill="#21346B"/>
    <circle cx="22" cy="22" r="2" fill="#F7941D"/>
    <circle cx="28" cy="22" r="2" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="34" cy="22" r="2" fill="#57B98A"/>
    <g stroke-linecap="round">
      <path d="M 24 36 L 32 42 L 24 48" stroke="#F7941D" stroke-width="3" fill="none"/>
      <path d="M 38 36 L 34 50" stroke="#FFFFFF" stroke-width="3" fill="none"/>
      <path d="M 44 36 L 52 42 L 44 48" stroke="#2D9CDB" stroke-width="3" fill="none"/>
      <path d="M 60 38 L 84 38" stroke="#FFFFFF" stroke-width="3" opacity="0.45"/>
      <path d="M 24 58 L 44 58" stroke="#FFFFFF" stroke-width="3" opacity="0.45"/>
      <path d="M 50 58 L 62 58" stroke="#2E9E6B" stroke-width="3"/>
      <path d="M 24 68 L 36 68" stroke="#FFFFFF" stroke-width="3" opacity="0.45"/>
      <path d="M 42 68 L 70 68" stroke="#F7941D" stroke-width="3" opacity="0.7"/>
    </g>
    <!-- gears -->
    <g transform="translate(122,20)">
      <g transform="scale(0.42)">
        <path d="M 34 0 L 40 0 L 43 12 L 55 6 L 62 13 L 56 25 L 68 28 L 68 34 L 56 37 L 62 49 L 55 56 L 43 50 L 40 62 L 34 62 L 31 50 L 19 56 L 12 49 L 18 37 L 6 34 L 6 28 L 18 25 L 12 13 L 19 6 L 31 12 Z" fill="#F7941D"/>
      </g>
      <circle cx="16" cy="16" r="5" fill="#FFFFFF"/>
    </g>
    <g transform="translate(146,38)">
      <g transform="scale(0.3)">
        <path d="M 34 0 L 40 0 L 43 12 L 55 6 L 62 13 L 56 25 L 68 28 L 68 34 L 56 37 L 62 49 L 55 56 L 43 50 L 40 62 L 34 62 L 31 50 L 19 56 L 12 49 L 18 37 L 6 34 L 6 28 L 18 25 L 12 13 L 19 6 L 31 12 Z" fill="#1B75BB"/>
      </g>
      <circle cx="11.5" cy="11.5" r="3.5" fill="#FFFFFF"/>
    </g>
    <!-- puzzle piece -->
    <g transform="translate(130,64)">
      <path d="M 4 8 C 4 6 6 4 8 4 L 15 4 C 15 1 17.5 -2 21 -2 C 24.5 -2 27 1 27 4 L 34 4 C 36 4 38 6 38 8 L 38 15 C 41 15 44 17.5 44 21 C 44 24.5 41 27 38 27 L 38 34 C 38 36 36 38 34 38 L 8 38 C 6 38 4 36 4 34 Z" fill="#2E9E6B"/>
      <circle cx="21" cy="21" r="4" fill="#FFFFFF" opacity="0.4"/>
    </g>
  </g>

  <!-- accent base strip -->
  <path d="M 44 302 L 260 302 L 260 310 C 260 313 258 316 254 316 L 50 316 C 46 316 44 313 44 310 Z" fill="#2E9E6B"/>
  <rect x="60" y="322" width="96" height="6" rx="3" fill="#C8D6EA" opacity="0.8"/>
</svg>
