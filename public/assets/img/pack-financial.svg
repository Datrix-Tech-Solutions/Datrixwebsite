<svg xmlns="http://www.w3.org/2000/svg" width="260" height="275" viewBox="0 0 340 360" fill="none">
  <defs>
    <linearGradient id="pfB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3FB3EA"/>
      <stop offset="1" stop-color="#1173B4"/>
    </linearGradient>
    <filter id="pfS" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#061B33" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="172" cy="338" rx="128" ry="12" fill="#061B33" opacity="0.35"/>

  <!-- box side panel -->
  <path d="M 260 62 L 296 84 L 296 330 L 260 316 Z" fill="#C8D6EA"/>
  <!-- box top flap -->
  <path d="M 44 62 L 80 44 L 296 44 L 260 62 Z" fill="#DEE7F2"/>
  <!-- box front -->
  <g filter="url(#pfS)">
    <rect x="44" y="62" width="216" height="254" rx="6" fill="#FFFFFF"/>
  </g>
  <rect x="44" y="62" width="216" height="14" fill="#F4F8FC"/>

  <!-- Datrix brand row -->
  <g transform="translate(60,88)">
    <circle cx="12" cy="12" r="12" fill="#F7941D"/>
    <path d="M 12 3 L 18.5 19 L 12 15 L 5.5 19 Z" fill="#21346B"/>
    <text x="32" y="12" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#21346B">Datrix</text>
    <text x="32" y="24" font-family="Arial, sans-serif" font-size="6.5" fill="#5C6B8A" letter-spacing="1.4">TECH SOLUTIONS</text>
  </g>

  <!-- product wordmark -->
  <text x="60" y="146" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#21346B">AccountingPhelo</text>
  <rect x="60" y="156" width="52" height="5" rx="2.5" fill="#F7941D"/>

  <!-- mini scene window -->
  <g transform="translate(60,176)">
    <rect x="0" y="0" width="184" height="106" rx="10" fill="#EAF4FB"/>
    <path d="M 12 96 C 60 82 70 30 172 22 L 172 96 Z" fill="url(#pfB)" opacity="0.16"/>
    <!-- dashboard -->
    <rect x="14" y="14" width="102" height="78" rx="7" fill="#FFFFFF"/>
    <path d="M 14 21 C 14 17 17 14 21 14 L 109 14 C 113 14 116 17 116 21 L 116 30 L 14 30 Z" fill="#21346B"/>
    <circle cx="21" cy="22" r="2" fill="#F7941D"/>
    <circle cx="27" cy="22" r="2" fill="#FFFFFF" opacity="0.8"/>
    <polyline points="24,66 40,54 54,60 70,44 86,50 104,38" stroke="#2E9E6B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="104" cy="38" r="3.5" fill="#F7941D"/>
    <rect x="24" y="74" width="40" height="6" rx="3" fill="#D9E4F1"/>
    <rect x="24" y="83" width="28" height="6" rx="3" fill="#D9E4F1"/>
    <!-- coins -->
    <g transform="translate(126,52)">
      <g fill="#F7941D" stroke="#E8720C" stroke-width="1.5">
        <ellipse cx="18" cy="38" rx="18" ry="6.5"/>
        <ellipse cx="15" cy="27" rx="18" ry="6.5"/>
        <ellipse cx="19" cy="16" rx="18" ry="6.5"/>
      </g>
      <ellipse cx="19" cy="16" rx="10" ry="3.5" fill="#FFB55A"/>
      <text x="19" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">$</text>
    </g>
    <!-- green tick -->
    <circle cx="164" cy="88" r="12" fill="#2E9E6B"/>
    <path d="M 158 88 L 162.5 92.5 L 170 84" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- accent base strip -->
  <path d="M 44 302 L 260 302 L 260 310 C 260 313 258 316 254 316 L 50 316 C 46 316 44 313 44 310 Z" fill="#21346B"/>
  <rect x="60" y="322" width="96" height="6" rx="3" fill="#C8D6EA" opacity="0.8"/>
</svg>
