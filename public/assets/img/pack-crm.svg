<svg xmlns="http://www.w3.org/2000/svg" width="260" height="275" viewBox="0 0 340 360" fill="none">
  <defs>
    <linearGradient id="pmB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3FB3EA"/>
      <stop offset="1" stop-color="#1173B4"/>
    </linearGradient>
    <filter id="pmS" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#061B33" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="172" cy="338" rx="128" ry="12" fill="#061B33" opacity="0.35"/>

  <!-- box side panel -->
  <path d="M 260 62 L 296 84 L 296 330 L 260 316 Z" fill="#C8D6EA"/>
  <!-- box top flap -->
  <path d="M 44 62 L 80 44 L 296 44 L 260 62 Z" fill="#DEE7F2"/>
  <!-- box front -->
  <g filter="url(#pmS)">
    <rect x="44" y="62" width="216" height="254" rx="6" fill="#FFFFFF"/>
  </g>
  <rect x="44" y="62" width="216" height="14" fill="#F4F8FC"/>

  <!-- Datrix brand row -->
  <g transform="translate(60,88)">
    <circle cx="12" cy="12" r="12" fill="#F7941D"/>
    <path d="M 12 3 L 18.5 19 L 12 15 L 5.5 19 Z" fill="#21346B"/>
    <text x="32" y="12" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#21346B">Datrix</text>
    <text x="32" y="24" font-family="Arial, sans-serif" font-size="6.5" fill="#5C6B8A" letter-spacing="1.4">TECH SOLUTIONS</text>
  </g>

  <!-- product wordmark -->
  <text x="60" y="146" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#21346B">MarketingPhelo</text>
  <rect x="60" y="156" width="52" height="5" rx="2.5" fill="#F7941D"/>

  <!-- mini scene window -->
  <g transform="translate(60,176)">
    <rect x="0" y="0" width="184" height="106" rx="10" fill="#EAF4FB"/>
    <path d="M 12 96 C 66 84 76 28 172 20 L 172 96 Z" fill="url(#pmB)" opacity="0.16"/>
    <!-- funnel -->
    <g transform="translate(16,16)">
      <path d="M 0 0 L 56 0 L 38 22 L 38 40 L 18 48 L 18 22 Z" fill="#21346B"/>
      <path d="M 12 6 L 44 6 L 32 20 L 24 20 Z" fill="#2D9CDB"/>
      <circle cx="28" cy="52" r="5" fill="#2E9E6B"/>
      <path d="M 25.5 52 L 27.5 54 L 31 50" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    <!-- growth dashboard -->
    <rect x="86" y="16" width="82" height="60" rx="6" fill="#FFFFFF"/>
    <path d="M 86 22 C 86 18 89 16 92 16 L 162 16 C 165 16 168 18 168 22 L 168 29 L 86 29 Z" fill="#1B75BB"/>
    <g>
      <rect x="94" y="46" width="9" height="22" rx="2.5" fill="#2D9CDB"/>
      <rect x="108" y="38" width="9" height="30" rx="2.5" fill="#1B75BB"/>
      <rect x="122" y="30" width="9" height="38" rx="2.5" fill="#F7941D"/>
      <rect x="136" y="42" width="9" height="26" rx="2.5" fill="#57B98A"/>
      <rect x="150" y="34" width="9" height="34" rx="2.5" fill="#21346B"/>
    </g>
    <path d="M 94 40 C 116 34 136 26 156 22" stroke="#F7941D" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- hearts + envelope -->
    <g fill="#F26D6D" transform="translate(96,86)">
      <path d="M 0 4 C 0 1.5 2.5 -0.5 4.5 1 C 6.5 -0.5 9 1.5 9 4 C 9 6.5 6.5 9 4.5 10.5 C 2.5 9 0 6.5 0 4 Z"/>
      <path d="M 14 4 C 14 1.5 16.5 -0.5 18.5 1 C 20.5 -0.5 23 1.5 23 4 C 23 6.5 20.5 9 18.5 10.5 C 16.5 9 14 6.5 14 4 Z"/>
    </g>
    <g transform="translate(130,84)">
      <rect x="0" y="0" width="34" height="22" rx="4" fill="#FFFFFF"/>
      <path d="M 3 5 L 17 14 L 31 5" stroke="#F7941D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <rect x="3" y="3.5" width="28" height="15" rx="2.5" fill="none" stroke="#21346B" stroke-width="2"/>
    </g>
  </g>

  <!-- accent base strip -->
  <path d="M 44 302 L 260 302 L 260 310 C 260 313 258 316 254 316 L 50 316 C 46 316 44 313 44 310 Z" fill="#F7941D"/>
  <rect x="60" y="322" width="96" height="6" rx="3" fill="#C8D6EA" opacity="0.8"/>
</svg>
