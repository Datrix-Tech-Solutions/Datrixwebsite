  <circle cx="674" cy="296" r="3" fill="#FFFFFF" opacity="0.65"/>
  <circle cx="226" cy="112" r="4" fill="#FFB55A"/>
  <circle cx="602" cy="520" r="4" fill="#FFB55A"/>
  <path d="M 640 250 L 642.5 256.5 L 649 259 L 642.5 261.5 L 640 268 L 637.5 261.5 L 631 259 L 637.5 256.5 Z" fill="#FFFFFF" opacity="0.9"/>
