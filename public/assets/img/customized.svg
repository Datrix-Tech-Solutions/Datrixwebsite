    <path d="M 632 484 C 630 458 632 440 638 432 C 644 426 666 426 672 432 C 678 440 679 458 676 484 Z" fill="#1B75BB"/>
    <path d="M 638 440 C 628 448 624 458 622 470" stroke="#1B75BB" stroke-width="9" stroke-linecap="round"/>
    <path d="M 674 440 C 682 448 686 458 686 470" stroke="#1B75BB" stroke-width="9" stroke-linecap="round"/>
