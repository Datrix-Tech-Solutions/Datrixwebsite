    <path d="M 0 0 C -2 -12 -4 -22 -10 -34 M 5 0 C 7 -10 9 -20 14 -30" stroke="#2E7D52" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-12" cy="-36" rx="12" ry="5" transform="rotate(-32 -12 -36)" fill="#2E9E6B"/>
    <ellipse cx="16" cy="-32" rx="12" ry="5" transform="rotate(30 16 -32)" fill="#57B98A"/>
